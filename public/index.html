<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 5px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .header p {
            font-size: 0.95em;
            opacity: 0.9;
        }

        .nav-tabs {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
            background: #f9f9f9;
        }

        .nav-tab {
            flex: 1;
            padding: 16px 20px;
            text-align: center;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 1em;
            font-weight: 500;
            color: #999;
            transition: all 0.3s ease;
        }

        .nav-tab.active {
            color: #667eea;
            border-bottom: 3px solid #667eea;
            background: white;
            margin-bottom: -2px;
        }

        .nav-tab:hover {
            color: #667eea;
            background: white;
        }

        .content {
            padding: 30px;
            min-height: 500px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-title {
            font-size: 1.8em;
            margin-bottom: 25px;
            color: #333;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
            font-size: 0.95em;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-success {
            background: #4caf50;
            color: white;
        }

        .btn-success:hover {
            background: #45a049;
        }

        .btn-danger {
            background: #ff6b6b;
            color: white;
            padding: 8px 16px;
            font-size: 0.9em;
        }

        .btn-danger:hover {
            background: #ee5a52;
        }

        .btn-edit {
            background: #2196f3;
            color: white;
            padding: 8px 16px;
            font-size: 0.9em;
        }

        .btn-edit:hover {
            background: #0b7dda;
        }

        .form-buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .list-item {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .list-item:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transform: translateX(5px);
        }

        .list-item-content {
            flex: 1;
        }

        .list-item-title {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }

        .list-item-info {
            font-size: 0.9em;
            color: #999;
        }

        .list-item-actions {
            display: flex;
            gap: 10px;
            margin-left: 20px;
        }

        .task-item.completed {
            opacity: 0.6;
        }

        .task-item.completed .list-item-title {
            text-decoration: line-through;
            color: #999;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            margin-right: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 0.95em;
            opacity: 0.9;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .filter-group input {
            flex: 1;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.95em;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border-left: 4px solid #bee5eb;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #999;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .list-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .list-item-actions {
                margin-left: 0;
                margin-top: 15px;
                width: 100%;
            }

            .list-item-actions .btn {
                flex: 1;
            }

            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 Todo App</h1>
            <p>Manage your tasks and users efficiently</p>
        </div>

        <div class="nav-tabs">
            <button class="nav-tab active" onclick="switchTab('users')">Users</button>
            <button class="nav-tab" onclick="switchTab('tasks')">Tasks</button>
            <button class="nav-tab" onclick="switchTab('statistics')">Statistics</button>
        </div>

        <div class="content">
            <!-- Users Tab -->
            <div id="users" class="tab-content active">
                <h2 class="section-title">Manage Users</h2>
                <div id="user-alerts"></div>

                <div style="background: white; padding: 20px; border-radius: 8px; margin-bottom: 30px; border: 2px solid #f0f0f0;">
                    <h3 style="margin-bottom: 15px; color: #555;">Add New User</h3>
                    <form onsubmit="handleCreateUser(event)">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="user-name">Full Name *</label>
                                <input type="text" id="user-name" placeholder="Enter full name" required minlength="3" maxlength="100">
                            </div>
                            <div class="form-group">
                                <label for="user-phone">Phone Number</label>
                                <input type="tel" id="user-phone" placeholder="e.g., +79994412345" minlength="10" maxlength="15">
                            </div>
                        </div>
                        <div class="form-buttons">
                            <button type="submit" class="btn btn-primary">Add User</button>
                            <button type="reset" class="btn btn-secondary">Clear</button>
                        </div>
                    </form>
                </div>

                <div id="users-list" class="list"></div>
                <div id="users-empty" class="empty-state">
                    <p>No users yet. Create one to get started!</p>
                </div>
            </div>

            <!-- Tasks Tab -->
            <div id="tasks" class="tab-content">
                <h2 class="section-title">Manage Tasks</h2>
                <div id="task-alerts"></div>

                <div style="background: white; padding: 20px; border-radius: 8px; margin-bottom: 30px; border: 2px solid #f0f0f0;">
                    <h3 style="margin-bottom: 15px; color: #555;">Create New Task</h3>
                    <form onsubmit="handleCreateTask(event)">
                        <div class="form-group">
                            <label for="task-title">Title *</label>
                            <input type="text" id="task-title" placeholder="Enter task title" required minlength="1" maxlength="100">
                        </div>
                        <div class="form-group">
                            <label for="task-description">Description</label>
                            <textarea id="task-description" placeholder="Enter task description (optional)" maxlength="1000"></textarea>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="task-author">Author (User ID) *</label>
                                <input type="number" id="task-author" placeholder="Select author" required>
                            </div>
                        </div>
                        <div class="form-buttons">
                            <button type="submit" class="btn btn-primary">Create Task</button>
                            <button type="reset" class="btn btn-secondary">Clear</button>
                        </div>
                    </form>
                </div>

                <div class="filter-group">
                    <select id="task-filter" onchange="loadTasks()" style="width: 200px;">
                        <option value="">All Users</option>
                        <option value="completed">Completed</option>
                        <option value="pending">Pending</option>
                    </select>
                </div>

                <div id="tasks-list" class="list"></div>
                <div id="tasks-empty" class="empty-state">
                    <p>No tasks yet. Create one to get started!</p>
                </div>
            </div>

            <!-- Statistics Tab -->
            <div id="statistics" class="tab-content">
                <h2 class="section-title">Statistics</h2>
                <div id="stat-alerts"></div>

                <div class="filter-group">
                    <input type="number" id="stat-user-id" placeholder="Filter by User ID (optional)" onchange="loadStatistics()">
                    <input type="date" id="stat-from" onchange="loadStatistics()">
                    <input type="date" id="stat-to" onchange="loadStatistics()">
                    <button class="btn btn-secondary" onclick="loadStatistics()">Load</button>
                </div>

                <div id="statistics-content"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5050/api/v1';
        let isConnected = false;

        // Helper Functions
        function showAlert(message, type = 'success', container = 'user-alerts') {
            const alertDiv = document.getElementById(container);
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            alertDiv.appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }

        async function checkConnection() {
            try {
                const response = await fetch(`${API_BASE}/users`, { 
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                isConnected = true;
                console.log('✅ Connected to API');
                return true;
            } catch (error) {
                isConnected = false;
                console.error('❌ Cannot connect to API:', error);
                showAlert(
                    `❌ Cannot connect to backend at ${API_BASE}. Make sure the server is running on localhost:5050`,
                    'error',
                    'user-alerts'
                );
                return false;
            }
        }

        async function apiCall(method, endpoint, data = null) {
            if (!isConnected) {
                throw new Error('Not connected to API. Please check if backend is running.');
            }

            try {
                const options = {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                    },
                };
                if (data) options.body = JSON.stringify(data);

                const url = `${API_BASE}${endpoint}`;
                console.log(`📡 ${method} ${url}`);

                const response = await fetch(url, options);
                if (!response.ok) {
                    try {
                        const error = await response.json();
                        throw new Error(error.message || `HTTP ${response.status}`);
                    } catch (e) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                }
                const result = response.status === 204 ? null : await response.json();
                console.log(`✅ Response received`);
                return result;
            } catch (error) {
                console.error('❌ API Error:', error);
                throw error;
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');

            if (tab === 'tasks') loadTasks();
            if (tab === 'statistics') loadStatistics();
            if (tab === 'users') loadUsers();
        }

        // User Management
        async function loadUsers() {
            try {
                const users = await apiCall('GET', '/users');
                const container = document.getElementById('users-list');
                const empty = document.getElementById('users-empty');

                if (!users || users.length === 0) {
                    container.innerHTML = '';
                    empty.style.display = 'block';
                    return;
                }

                empty.style.display = 'none';
                container.innerHTML = users.map(user => `
                    <div class="list-item">
                        <div class="list-item-content">
                            <div class="list-item-title">${user.full_name}</div>
                            <div class="list-item-info">
                                ID: ${user.id} | Phone: ${user.phone_number || 'N/A'} | Version: ${user.version}
                            </div>
                        </div>
                        <div class="list-item-actions">
                            <button class="btn btn-edit" onclick="editUser(${user.id})">Edit</button>
                            <button class="btn btn-danger" onclick="deleteUser(${user.id})">Delete</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                showAlert(`Failed to load users: ${error.message}`, 'error', 'user-alerts');
            }
        }

        async function handleCreateUser(event) {
            event.preventDefault();
            const name = document.getElementById('user-name').value;
            const phone = document.getElementById('user-phone').value || null;

            try {
                if (!isConnected) {
                    showAlert('Not connected to API. Check console for details.', 'error', 'user-alerts');
                    return;
                }
                await apiCall('POST', '/users', {
                    full_name: name,
                    phone_number: phone
                });
                showAlert('✅ User created successfully!', 'success', 'user-alerts');
                event.target.reset();
                loadUsers();
            } catch (error) {
                showAlert(`❌ Failed to create user: ${error.message}`, 'error', 'user-alerts');
            }
        }

        async function deleteUser(id) {
            if (!confirm('Are you sure you want to delete this user?')) return;
            try {
                await apiCall('DELETE', `/users/${id}`);
                showAlert('User deleted successfully!', 'success', 'user-alerts');
                loadUsers();
            } catch (error) {
                showAlert(`Failed to delete user: ${error.message}`, 'error', 'user-alerts');
            }
        }

        async function editUser(id) {
            try {
                const user = await apiCall('GET', `/users/${id}`);
                const newName = prompt('Enter new full name:', user.full_name);
                if (!newName) return;

                const newPhone = prompt('Enter new phone (or leave empty):', user.phone_number || '');
                await apiCall('PATCH', `/users/${id}`, {
                    full_name: newName,
                    phone_number: newPhone || null
                });
                showAlert('User updated successfully!', 'success', 'user-alerts');
                loadUsers();
            } catch (error) {
                showAlert(`Failed to update user: ${error.message}`, 'error', 'user-alerts');
            }
        }

        // Task Management
        async function loadTasks() {
            try {
                const filter = document.getElementById('task-filter').value;
                let endpoint = '/tasks';
                
                if (filter && filter !== '') {
                    // filter is not used in current API, so just load all
                    // The filtering for completed/pending is done on client side
                }
                
                const tasks = await apiCall('GET', endpoint);
                const container = document.getElementById('tasks-list');
                const empty = document.getElementById('tasks-empty');

                let filteredTasks = tasks || [];
                
                // Client-side filtering
                if (filter === 'completed') {
                    filteredTasks = filteredTasks.filter(t => t.completed);
                } else if (filter === 'pending') {
                    filteredTasks = filteredTasks.filter(t => !t.completed);
                }

                if (!filteredTasks || filteredTasks.length === 0) {
                    container.innerHTML = '';
                    empty.style.display = 'block';
                    return;
                }

                empty.style.display = 'none';
                container.innerHTML = filteredTasks.map(task => `
                    <div class="list-item task-item ${task.completed ? 'completed' : ''}">
                        <div class="checkbox-wrapper">
                            <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} 
                                   onchange="toggleTask(${task.id}, this.checked)">
                            <div class="list-item-content">
                                <div class="list-item-title">${task.title}</div>
                                <div class="list-item-info">
                                    ${task.description ? task.description + ' | ' : ''}Author: ${task.author_user_id} | Version: ${task.version}
                                </div>
                            </div>
                        </div>
                        <div class="list-item-actions">
                            <button class="btn btn-edit" onclick="editTask(${task.id})">Edit</button>
                            <button class="btn btn-danger" onclick="deleteTask(${task.id})">Delete</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                showAlert(`Failed to load tasks: ${error.message}`, 'error', 'task-alerts');
            }
        }

        async function handleCreateTask(event) {
            event.preventDefault();
            const title = document.getElementById('task-title').value;
            const description = document.getElementById('task-description').value || null;
            const authorId = parseInt(document.getElementById('task-author').value);

            try {
                await apiCall('POST', '/tasks', {
                    title,
                    description,
                    author_user_id: authorId
                });
                showAlert('Task created successfully!', 'success', 'task-alerts');
                event.target.reset();
                loadTasks();
            } catch (error) {
                showAlert(`Failed to create task: ${error.message}`, 'error', 'task-alerts');
            }
        }

        async function toggleTask(id, completed) {
            try {
                await apiCall('PATCH', `/tasks/${id}`, { completed });
                showAlert('Task updated successfully!', 'success', 'task-alerts');
                loadTasks();
            } catch (error) {
                showAlert(`Failed to update task: ${error.message}`, 'error', 'task-alerts');
            }
        }

        async function deleteTask(id) {
            if (!confirm('Are you sure you want to delete this task?')) return;
            try {
                await apiCall('DELETE', `/tasks/${id}`);
                showAlert('Task deleted successfully!', 'success', 'task-alerts');
                loadTasks();
            } catch (error) {
                showAlert(`Failed to delete task: ${error.message}`, 'error', 'task-alerts');
            }
        }

        async function editTask(id) {
            try {
                const task = await apiCall('GET', `/tasks/${id}`);
                const newTitle = prompt('Enter new title:', task.title);
                if (!newTitle) return;

                await apiCall('PATCH', `/tasks/${id}`, {
                    title: newTitle,
                    description: task.description
                });
                showAlert('Task updated successfully!', 'success', 'task-alerts');
                loadTasks();
            } catch (error) {
                showAlert(`Failed to update task: ${error.message}`, 'error', 'task-alerts');
            }
        }

        // Statistics
        async function loadStatistics() {
            try {
                const userId = document.getElementById('stat-user-id').value;
                const from = document.getElementById('stat-from').value;
                const to = document.getElementById('stat-to').value;

                let endpoint = '/statistics';
                const params = [];
                if (userId) params.push(`user_id=${userId}`);
                if (from) params.push(`from=${from}T00:00:00Z`);
                if (to) params.push(`to=${to}T23:59:59Z`);
                if (params.length) endpoint += '?' + params.join('&');

                console.log('Loading stats from:', endpoint);
                const stats = await apiCall('GET', endpoint);
                console.log('Stats received:', stats);
                
                const container = document.getElementById('statistics-content');

                const avgTime = stats.task_average_completion_time || 'N/A';
                const rate = stats.task_completed_rate ? stats.task_completed_rate.toFixed(1) : '0';

                container.innerHTML = `
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value">${stats.task_created}</div>
                            <div class="stat-label">Tasks Created</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${stats.task_completed}</div>
                            <div class="stat-label">Tasks Completed</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${rate}%</div>
                            <div class="stat-label">Completion Rate</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${avgTime}</div>
                            <div class="stat-label">Avg. Completion Time</div>
                        </div>
                    </div>
                `;
            } catch (error) {
                showAlert(`Failed to load statistics: ${error.message}`, 'error', 'stat-alerts');
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🚀 App starting...');
            const connected = await checkConnection();
            if (connected) {
                loadUsers();
            }
        });
    </script>
</body>
</html>
